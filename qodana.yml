#-------------------------------------------------------------------------------#
#               Qodana analysis configuration                                    #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html             #
#-------------------------------------------------------------------------------#
version: "1.0"

# The JVM-community linter is enough for a Kotlin IntelliJ plugin.
linter: jetbrains/qodana-jvm-community:2026.2

profile:
  name: qodana.recommended

# Generated / vendored trees that should not be inspected.
exclude:
  - name: All
    paths:
      - .qodana
      - build
      - gradle/wrapper
      - testProject
