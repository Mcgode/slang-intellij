name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  qodana:
    name: Qodana
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
    steps:
      - name: Fetch Sources
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}  # the actual PR commit, not the merge commit
          fetch-depth: 0  # full history so new problems can be attributed to their commit

      - name: Qodana Scan
        uses: JetBrains/qodana-action@v2026.2
        with:
          pr-mode: false
          upload-result: true  # keep the SARIF report as a workflow artifact
