# IntelliJ Platform Artifacts Repositories -> https://plugins.jetbrains.com/docs/intellij/intellij-artifacts.html

pluginGroup = slang.plugin
pluginName = Slang Language Support
pluginRepositoryUrl = https://github.com/Mcgode/slang-intellij
# SemVer format -> https://semver.org
pluginVersion = 0.2.1-beta.2

# Supported build number ranges -> https://plugins.jetbrains.com/docs/intellij/build-number-ranges.html
# v2 is LSP-first and uses the open LSP client API (LspIntegrationProvider), available since 2026.1.4 / 2026.2.
pluginSinceBuild = 262

# IntelliJ Platform version to build/test against. v2 targets the unified IntelliJ IDEA distribution
# (LSP API is bundled and available without a paid subscription since 2025.2; unified since 2025.3).
platformVersion = 2026.2

# CLion build used only by the `runClionForTests` sandbox task. Keep the major.minor in step with
# platformVersion so the plugin (compiled against 262) stays binary-compatible with the IDE.
clionVersion = 2026.2

riderVersion = 2026.2

# Gradle Releases -> https://github.com/gradle/gradle/releases
gradleVersion = 9.7.1

# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency = false

# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache = true

# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching = true
